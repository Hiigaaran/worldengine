[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
worldengine-core = { path = "crates/core" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["svg"] }

# La generación y el render del mapa son lentos sin optimizar.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
